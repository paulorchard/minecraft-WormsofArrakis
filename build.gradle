plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_archive_name }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

def instanceMods = 'C:/Users/paulo/curseforge/minecraft/Instances/ArrakisTest01/mods'
def geckolibJar = "${instanceMods}/geckolib-neoforge-26.1.2-5.5.2.jar"
def geckomeshJar = "${instanceMods}/geckomesh-neoforge-26.1-1.2.0.jar"

neoForge {
    version = project.neo_version
    // Compile-time copy of GeckoLib's own META-INF/interface_injections.json (EntityRenderState implements GeoRenderState). Dev only, not shipped.
    interfaceInjectionData { from file('src/dev/geckolib_interface_injections.json') }
    runs {
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run-server')
        }
        client {
            client()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

configurations { runtimeClasspath.extendsFrom localRuntime }

dependencies {
    // Libraries are NOT bundled: compile against the exact jars in the owner's test instance.
    compileOnly files(geckolibJar)
    localRuntime files(geckolibJar)
    if (project.hasProperty('geckomesh')) {
        compileOnly files(geckomeshJar)
        localRuntime files(geckomeshJar)
    }
    testImplementation files(geckolibJar)
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach { useJUnitPlatform() }

// Forward the terminal to the dev server console so commands can be piped in (smoke test).
tasks.matching { it.name == 'runServer' }.configureEach { standardInput = System.in }
